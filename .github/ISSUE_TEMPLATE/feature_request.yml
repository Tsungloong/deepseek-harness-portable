name: Feature request
description: 建议便携层的新能力或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本仓库是便携引导层，不修改官方 DeepSeek Harness 程序。官方 Web、内核与插件功能请向上游反馈。
        请描述真实使用场景与期望行为。
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复建议
          required: true
        - label: 该建议属于便携层（引导、隔离、迁移、更新、诊断），不是官方 Harness 的界面或内核功能
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景与当前的不便
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
  - type: input
    id: platform
    attributes:
      label: 平台（可选）
      placeholder: Windows 11 x64 / Ubuntu 24.04 x64 / macOS 14 arm64

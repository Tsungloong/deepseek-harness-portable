name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Validate tag and repository consistency
        run: node scripts/check.mjs --tag "$GITHUB_REF_NAME"

  ci:
    name: CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  package:
    name: Package and publish
    needs: [validate, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Validate tag and repository consistency
        run: node scripts/check.mjs --tag "$GITHUB_REF_NAME"
      - name: Build release archives
        run: node scripts/package-release.mjs
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "DeepSeek Harness Portable $GITHUB_REF_NAME" --notes-from-tag dist/*
